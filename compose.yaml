services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: chat_with_pdf
      POSTGRES_USER: chatpdf
      POSTGRES_PASSWORD: chatpdf
    ports:
      - "5433:5432"
    volumes:
      - chatpdf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatpdf -d chat_with_pdf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chatpdf_postgres_data:
